<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greysteel · Priority Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1a73e8;--blue-light:#e8f0fe;--green:#188038;--green-light:#e6f4ea;
  --yellow:#f29900;--yellow-light:#fef7e0;--orange:#fa7b17;--orange-light:#fce8d2;
  --red:#d93025;--red-light:#fce8e6;
  --text:#202124;--text2:#5f6368;--text3:#80868b;
  --border:#dadce0;--bg:#f8f9fa;--white:#fff;
  --shadow:0 1px 3px rgba(60,64,67,.15),0 1px 2px rgba(60,64,67,.3);
  --shadow-lg:0 4px 12px rgba(60,64,67,.15),0 2px 6px rgba(60,64,67,.1);
  --header:56px;--toolbar:48px;
}
html,body{height:100%;font-family:'Roboto',sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}

/* HEADER */
header{
  position:fixed;top:0;left:0;right:0;height:var(--header);
  background:var(--white);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:16px;z-index:200;
}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
.logo-g{
  width:32px;height:32px;background:var(--blue);color:#fff;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Google Sans',sans-serif;font-size:18px;font-weight:600;
}
.logo-name{font-family:'Google Sans',sans-serif;font-size:16px;font-weight:500;color:var(--text)}
.logo-sep{color:var(--border);font-size:18px;font-weight:300}
.logo-page{font-family:'Google Sans',sans-serif;font-size:15px;color:var(--text2)}
.search-bar{
  flex:1;max-width:480px;position:relative;
}
.search-bar input{
  width:100%;height:36px;border:1px solid var(--border);border-radius:24px;
  padding:0 16px 0 40px;font-size:14px;color:var(--text);background:var(--bg);
  outline:none;transition:all .2s;
}
.search-bar input:focus{background:var(--white);border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-light)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.hdr-btn{
  height:36px;padding:0 16px;border-radius:4px;font-size:13px;font-weight:500;
  display:flex;align-items:center;gap:6px;transition:background .15s;color:var(--text2);
}
.hdr-btn:hover{background:var(--bg)}
.hdr-btn.active{color:var(--blue);background:var(--blue-light)}
.hdr-badge{
  background:var(--text2);color:#fff;border-radius:12px;
  padding:2px 8px;font-size:11px;font-weight:500;
}
.loading-spinner{
  width:18px;height:18px;border:2px solid var(--border);
  border-top-color:var(--blue);border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOOLBAR */
.toolbar{
  position:fixed;top:var(--header);left:0;right:0;height:var(--toolbar);
  background:var(--white);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:8px;z-index:190;
}
.tier-filter{
  display:flex;align-items:center;gap:4px;
  background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:2px;
}
.tier-btn{
  padding:3px 14px;border-radius:16px;font-size:12px;font-weight:500;
  transition:all .15s;color:var(--text2);
}
.tier-btn:hover{background:var(--border)}
.tier-btn.active{color:#fff}
.tier-btn[data-tier="all"].active{background:var(--text2)}
.tier-btn[data-tier="hot"].active{background:var(--red)}
.tier-btn[data-tier="warm"].active{background:var(--orange)}
.tier-btn[data-tier="watch"].active{background:var(--yellow);color:#202124}
.tier-btn[data-tier="cold"].active{background:var(--green)}
.toolbar-sep{width:1px;height:24px;background:var(--border);margin:0 4px}
.sort-select{
  height:32px;border:1px solid var(--border);border-radius:4px;
  padding:0 8px;font-size:13px;color:var(--text);background:var(--white);
  outline:none;cursor:pointer;
}
.tb-count{margin-left:auto;font-size:12px;color:var(--text2)}

/* WEIGHTS PANEL */
.weights-panel{
  position:fixed;top:calc(var(--header) + var(--toolbar));right:0;
  width:360px;background:var(--white);border-left:1px solid var(--border);
  border-bottom:1px solid var(--border);border-bottom-left-radius:8px;
  box-shadow:var(--shadow-lg);z-index:500;
  transform:translateY(-110%);opacity:0;pointer-events:none;
  transition:transform .25s ease,opacity .2s ease;
}
.weights-panel.open{transform:translateY(0);opacity:1;pointer-events:all}
.wp-header{padding:16px 16px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.wp-title{font-family:'Google Sans',sans-serif;font-size:14px;font-weight:500}
.wp-body{padding:16px}
.weight-row{margin-bottom:16px}
.weight-label{display:flex;justify-content:space-between;margin-bottom:6px}
.wl-name{font-size:13px;font-weight:500;color:var(--text)}
.wl-val{font-size:13px;font-weight:600;color:var(--blue)}
.weight-slider{
  width:100%;height:4px;border-radius:2px;background:var(--border);
  -webkit-appearance:none;outline:none;cursor:pointer;
}
.weight-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--blue);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.hold-periods{margin-top:4px}
.hp-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.hp-chip{
  padding:3px 12px;border-radius:16px;font-size:12px;font-weight:500;
  border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:all .15s;background:var(--white);
}
.hp-chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.hp-custom-row{display:flex;gap:6px;margin-top:8px;align-items:center}
.hp-input{
  width:80px;height:30px;border:1px solid var(--border);border-radius:4px;
  padding:0 8px;font-size:13px;outline:none;
}
.hp-input:focus{border-color:var(--blue)}
.hp-add{
  height:30px;padding:0 12px;background:var(--blue);color:#fff;
  border-radius:4px;font-size:12px;font-weight:500;transition:background .15s;
}
.hp-add:hover{background:#1557b0}
.recalc-btn{
  width:100%;height:36px;background:var(--blue);color:#fff;border-radius:4px;
  font-size:13px;font-weight:500;margin-top:4px;transition:background .15s;
}
.recalc-btn:hover{background:#1557b0}

/* MAIN LAYOUT */
.main{
  margin-top:calc(var(--header) + var(--toolbar));
  height:calc(100vh - var(--header) - var(--toolbar));
  display:flex;overflow:hidden;
}
.list-panel{
  width:420px;flex-shrink:0;overflow-y:auto;background:var(--white);
  border-right:1px solid var(--border);
}
.map-panel{flex:1;position:relative}
#map{width:100%;height:100%}

/* PROPERTY CARDS */
.prop-card{
  padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;
  transition:background .1s;position:relative;
}
.prop-card:hover{background:var(--bg)}
.prop-card.selected{background:var(--blue-light)}
.pc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.pc-address{font-size:13px;font-weight:500;color:var(--text);line-height:1.4}
.pc-sub{font-size:11px;color:var(--text2);margin-top:2px}
.score-badge{
  flex-shrink:0;min-width:44px;height:28px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Google Sans',sans-serif;font-size:13px;font-weight:600;
}
.score-badge.hot{background:var(--red-light);color:var(--red)}
.score-badge.warm{background:var(--orange-light);color:var(--orange)}
.score-badge.watch{background:var(--yellow-light);color:#c17800}
.score-badge.cold{background:var(--green-light);color:var(--green)}
.pc-chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.pc-chip{
  padding:2px 8px;border-radius:4px;font-size:10px;font-weight:500;
  background:var(--bg);color:var(--text2);border:1px solid var(--border);
}
.pc-chip.distress{background:#fce8e6;color:#d93025;border-color:#f5c6c2}
.pc-chip.maturity{background:#e8f0fe;color:#1a73e8;border-color:#aecbfa}
.pc-chip.hold{background:#fef7e0;color:#c17800;border-color:#fde68a}
.pc-chip.market{background:#e6f4ea;color:#188038;border-color:#a8d5b5}
.empty-state{padding:60px 20px;text-align:center;color:var(--text2)}
.empty-icon{font-size:32px;margin-bottom:12px}
.loading-list{padding:20px}
.skeleton{height:12px;background:var(--border);border-radius:4px;margin-bottom:8px;animation:shimmer 1.4s infinite}
@keyframes shimmer{0%,100%{opacity:.4}50%{opacity:.8}}

/* DETAIL DRAWER */
.detail-drawer{
  position:fixed;right:0;top:0;bottom:0;width:460px;
  background:var(--white);box-shadow:-4px 0 16px rgba(60,64,67,.15);
  z-index:600;transform:translateX(100%);transition:transform .25s ease;
  display:flex;flex-direction:column;overflow:hidden;
}
#drawerContent{display:flex;flex-direction:column;flex:1;overflow:hidden;min-height:0;}
.detail-drawer.open{transform:translateX(0)}
.detail-drawer *{box-sizing:border-box}
.dd-header{
  padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:flex-start;gap:12px;flex-shrink:0;
}
.dd-close{
  width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:var(--text2);transition:background .15s;flex-shrink:0;
}
.dd-close:hover{background:var(--bg)}
.dd-title{font-family:'Google Sans',sans-serif;font-size:16px;font-weight:500;line-height:1.3}
.dd-sub{font-size:12px;color:var(--text2);margin-top:3px}
.dd-score-big{
  margin-left:auto;flex-shrink:0;width:52px;height:52px;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.dd-score-big.hot{background:var(--red-light)}
.dd-score-big.warm{background:var(--orange-light)}
.dd-score-big.watch{background:var(--yellow-light)}
.dd-score-big.cold{background:var(--green-light)}
.ddsb-num{font-family:'Google Sans',sans-serif;font-size:22px;font-weight:600}
.ddsb-label{font-size:9px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;margin-top:1px}
.hot .ddsb-num,.hot .ddsb-label{color:var(--red)}
.warm .ddsb-num,.warm .ddsb-label{color:var(--orange)}
.watch .ddsb-num,.watch .ddsb-label{color:#c17800}
.cold .ddsb-num,.cold .ddsb-label{color:var(--green)}
.dd-body{flex:1;overflow-y:scroll;padding:16px 20px 40px;display:flex;flex-direction:column;gap:20px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;min-height:0;}
.dd-section{margin-bottom:20px}
.dd-section-title{
  font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text3);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);
}
.score-breakdown{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.sb-row{
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:var(--bg);border-radius:6px;
}
.sb-cat{
  width:80px;flex-shrink:0;font-size:11px;font-weight:500;
  text-transform:uppercase;letter-spacing:.05em;
}
.sb-bar-wrap{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.sb-bar{height:100%;border-radius:3px;transition:width .4s ease}
.sb-bar.hold{background:var(--yellow)}
.sb-bar.maturity{background:var(--blue)}
.sb-bar.distress{background:var(--red)}
.sb-bar.market{background:var(--green)}
.sb-score{width:32px;text-align:right;font-size:12px;font-weight:600;flex-shrink:0}
.sb-reasons{padding:4px 0 0 12px;list-style:none;display:flex;flex-direction:column;gap:4px}
.sb-reasons li{font-size:12px;color:var(--text2);display:flex;align-items:flex-start;gap:6px}
.sb-reasons li::before{content:'•';color:var(--text3);flex-shrink:0}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dg-section-head{grid-column:1/-1;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-top:8px;padding-bottom:4px;border-bottom:1px solid var(--blue-light)}
.dg-item{padding:10px;background:var(--bg);border-radius:6px}
.dg-label{font-size:11px;color:var(--text3);margin-bottom:3px}
.dg-val{font-size:13px;font-weight:500;color:var(--text)}
.dg-item.full{grid-column:1/-1}
.contact-card{
  padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;
}
.cc-name{font-size:13px;font-weight:500}
.cc-title{font-size:12px;color:var(--text2);margin-top:2px}
.cc-contact{font-size:12px;color:var(--blue);margin-top:4px;display:flex;flex-direction:column;gap:2px}
.reo-link{
  display:inline-flex;align-items:center;gap:4px;color:var(--blue);
  font-size:13px;font-weight:500;text-decoration:none;
  padding:8px 0;
}
.reo-link:hover{text-decoration:underline}

/* MAP STYLES */
.map-dot{
  border-radius:50%;border:2px solid rgba(255,255,255,.8);
  cursor:pointer;transition:transform .1s;
}
.map-dot:hover{transform:scale(1.3)}
.map-dot.hot{background:var(--red)}
.map-dot.warm{background:var(--orange)}
.map-dot.watch{background:var(--yellow)}
.map-dot.cold{background:var(--green)}
.map-dot.selected{
  transform:scale(1.5);
  box-shadow:0 0 0 4px rgba(26,115,232,.4);
}
.leaflet-tooltip{
  background:var(--text);color:#fff;border:none;border-radius:4px;
  font-size:11px;padding:4px 8px;font-family:'Roboto',sans-serif;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}
.leaflet-tooltip::before{border-top-color:var(--text)}
.map-legend{
  position:absolute;bottom:24px;left:16px;z-index:100;
  background:var(--white);border:1px solid var(--border);
  border-radius:8px;padding:10px 14px;box-shadow:var(--shadow);
}
.ml-title{font-size:11px;font-weight:500;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.ml-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ml-dot{width:10px;height:10px;border-radius:50%}
.ml-label{font-size:12px;color:var(--text)}
.leaflet-control-zoom a{
  font-size:18px !important;color:var(--text) !important;
  background:var(--white) !important;border-color:var(--border) !important;
}
.leaflet-control-zoom a:hover{background:var(--bg) !important;color:var(--blue) !important}
.overlay-backdrop{
  position:fixed;inset:0;background:rgba(32,33,36,.5);z-index:599;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.overlay-backdrop.show{opacity:1;pointer-events:all}
</style>
</head>
<body>

<header>
  <a class="logo" href="#">
    <div class="logo-g">G</div>
    <span class="logo-name">Greysteel</span>
    <span class="logo-sep">/</span>
    <span class="logo-page">Priority Dashboard</span>
  </a>
  <div class="search-bar">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
      <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
      <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <input type="text" id="searchInput" placeholder="Search by address, owner, or submarket...">
  </div>
  <div class="header-right">
    <div id="loadingSpinner" class="loading-spinner" style="display:none"></div>
    <span id="totalBadge" class="hdr-badge">–</span>
    <button class="hdr-btn" id="weightsToggleBtn" onclick="toggleWeights()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Scoring Weights
    </button>
  </div>
</header>

<div class="toolbar">
  <div class="tier-filter">
    <button class="tier-btn active" data-tier="all" onclick="setTier('all')">All</button>
    <button class="tier-btn" data-tier="hot" onclick="setTier('hot')">🔴 Hot</button>
    <button class="tier-btn" data-tier="warm" onclick="setTier('warm')">🟠 Warm</button>
    <button class="tier-btn" data-tier="watch" onclick="setTier('watch')">🟡 Watch</button>
    <button class="tier-btn" data-tier="cold" onclick="setTier('cold')">🟢 Cold</button>
  </div>
  <div class="toolbar-sep"></div>
  <select class="sort-select" id="sortSelect" onchange="resort()">
    <option value="score">Sort: Priority Score</option>
    <option value="maturity">Sort: Soonest Maturity</option>
    <option value="hold">Sort: Longest Hold</option>
    <option value="sale_amount">Sort: Sale Price</option>
  </select>
  <span class="tb-count" id="tbCount"></span>
  <span class="tb-count" id="matchInfo" style="margin-left:0;color:var(--text3)"></span>
</div>

<!-- Weights Panel -->
<div class="weights-panel" id="weightsPanel">
  <div class="wp-header">
    <span class="wp-title">Scoring Weights & Configuration</span>
    <button onclick="toggleWeights()" style="color:var(--text2);padding:4px">✕</button>
  </div>
  <div class="wp-body">
    <div class="weight-row">
      <div class="weight-label">
        <span class="wl-name">🏠 Hold Period</span>
        <span class="wl-val" id="wHoldVal">3</span>
      </div>
      <input type="range" class="weight-slider" id="wHold" min="0" max="5" value="3" step="1"
        oninput="document.getElementById('wHoldVal').textContent=this.value">
    </div>
    <div class="weight-row">
      <div class="weight-label">
        <span class="wl-name">📅 Loan Maturity</span>
        <span class="wl-val" id="wMatVal">4</span>
      </div>
      <input type="range" class="weight-slider" id="wMat" min="0" max="5" value="4" step="1"
        oninput="document.getElementById('wMatVal').textContent=this.value">
    </div>
    <div class="weight-row">
      <div class="weight-label">
        <span class="wl-name">⚠️ Distress Signals</span>
        <span class="wl-val" id="wDistVal">5</span>
      </div>
      <input type="range" class="weight-slider" id="wDist" min="0" max="5" value="5" step="1"
        oninput="document.getElementById('wDistVal').textContent=this.value">
    </div>
    <div class="weight-row">
      <div class="weight-label">
        <span class="wl-name">📊 Market Signals</span>
        <span class="wl-val" id="wMktVal">2</span>
      </div>
      <input type="range" class="weight-slider" id="wMkt" min="0" max="5" value="2" step="1"
        oninput="document.getElementById('wMktVal').textContent=this.value">
    </div>
    <div class="weight-row">
      <div class="weight-label"><span class="wl-name">Hold Period Milestones (years)</span></div>
      <div class="hp-row" id="holdChips">
        <button class="hp-chip active" data-yr="3" onclick="toggleHP(this)">3yr</button>
        <button class="hp-chip active" data-yr="5" onclick="toggleHP(this)">5yr</button>
        <button class="hp-chip active" data-yr="7" onclick="toggleHP(this)">7yr</button>
        <button class="hp-chip active" data-yr="10" onclick="toggleHP(this)">10yr</button>
      </div>
      <div class="hp-custom-row">
        <input type="number" class="hp-input" id="customHP" placeholder="e.g. 12" min="1" max="30">
        <button class="hp-add" onclick="addCustomHP()">Add</button>
      </div>
    </div>
    <button class="recalc-btn" onclick="recalculate()">Recalculate Scores</button>
  </div>
</div>

<div class="main">
  <div class="list-panel" id="listPanel">
    <div class="loading-list" id="loadingList">
      <div class="skeleton" style="height:80px;border-radius:4px;margin-bottom:1px"></div>
      <div class="skeleton" style="height:80px;border-radius:4px;margin-bottom:1px"></div>
      <div class="skeleton" style="height:80px;border-radius:4px;margin-bottom:1px"></div>
      <div class="skeleton" style="height:80px;border-radius:4px;margin-bottom:1px"></div>
      <div class="skeleton" style="height:80px;border-radius:4px;margin-bottom:1px"></div>
      <div class="skeleton" style="height:80px;border-radius:4px;margin-bottom:1px"></div>
      <div class="skeleton" style="height:80px;border-radius:4px;margin-bottom:1px"></div>
      <div class="skeleton" style="height:80px;border-radius:4px;margin-bottom:1px"></div>
    </div>
  </div>
  <div class="map-panel">
    <div id="map"></div>
    <div class="map-legend">
      <div class="ml-title">Priority Score</div>

let allData = [];

// ─── SCORING ───────────────────────────────────────────────────────────────
function parseD(v){ if(!v) return null; const d=new Date(v); return isNaN(d)?null:d; }
function fmtMoney(v){ const n=parseFloat(v); return isNaN(n)?null:'$'+Math.round(n).toLocaleString(); }
function fmtDate(v){ const d=parseD(v); return d?d.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}):null; }
function yearsSince(d){ return d?(new Date()-d)/(365.25*24*3600*1000):null; }
function daysUntil(d){ return d?(d-new Date())/(24*3600*1000):null; }

function scoreProperty(p){
  const today = new Date();
  const details = [];
  const cats = {holdPeriod:0, loanMaturity:0, distress:0, marketSignals:0};

  // HOLD PERIOD
  // Use most recent sale date (sale_recorded_date = most recent, sale2_recorded_date = prior sale)
  const sd1 = parseD(p.sale_recorded_date || p.sale_date);
  const sd2 = parseD(p.sale2_recorded_date);
  let saleDate = null;
  if(sd1 && sd2) saleDate = sd1 > sd2 ? sd1 : sd2;
  else saleDate = sd1 || sd2;

  if(saleDate){
    const yrs = yearsSince(saleDate);
    const saleDateStr = fmtDate(saleDate);
    let best=0, bestLabel='';
    for(const period of holdPeriods){
      const diff = yrs - period;
      let s=0, lbl='';
      if(diff >= -0.75 && diff < 0){
        const moAway = Math.round(-diff*12);
        s = 60 + (1-(Math.abs(diff)/0.75))*40;
        lbl = `${moAway} month${moAway!==1?'s':''} away from ${period}-year hold milestone (last sold ${saleDateStr})`;
      } else if(diff >= 0 && diff < 0.5){
        s = 100;
        lbl = `Just hit ${period}-year hold milestone (last sold ${saleDateStr})`;
      } else if(diff >= 0.5 && diff < 1){
        s = 80;
        lbl = `${Math.round(diff*12)} months past ${period}-year hold (last sold ${saleDateStr})`;
      } else if(diff >= 1 && diff < 2){
        s = 60 - (diff-1)*30;
        lbl = `${Math.round(yrs*10)/10} years since sale — passed ${period}-yr milestone (last sold ${saleDateStr})`;
      }
      if(s>best){ best=s; bestLabel=lbl; }
    }
    cats.holdPeriod = Math.round(best);
    if(bestLabel) details.push({cat:'Hold Period', label:bestLabel});
    else {
      const sortedPeriods = [...holdPeriods].sort((a,b)=>a-b);
      const nextMilestone = sortedPeriods.find(period => period > yrs);
      if(nextMilestone){
        const moToNext = Math.round((nextMilestone - yrs)*12);
        details.push({cat:'Hold Period', label:`${Math.round(yrs*10)/10} yrs since last sale — ${moToNext} months until ${nextMilestone}-yr milestone (last sold ${saleDateStr})`});
      } else {
        details.push({cat:'Hold Period', label:`${Math.round(yrs*10)/10} yrs since last sale (last sold ${saleDateStr})`});
      }
    }
  } else {
    details.push({cat:'Hold Period', label:'No sale date on record — hold period cannot be calculated'});
  }

  // LOAN MATURITY -- only score the most relevant mortgage
  // Logic: prefer the one with the future or most recent maturity date
  // Ignore maturities that are more than 5 years in the past (stale/paid off)
  const today2 = new Date();
  const STALE_CUTOFF_DAYS = -365; // ignore loans matured more than 1 year ago
  const mats = [
    {date:parseD(p.mortgage_maturity_date), amt:parseFloat(p.mortgage_amount)||0,
     lender:p.mortgage_standardized_name||p.mortgage_recorded_name, name:'Primary loan'},
    {date:parseD(p.mortgage2_maturity_date), amt:parseFloat(p.mortgage2_amount)||0,
     lender:p.mortgage2_standardized_name||p.mortgage2_recorded_name, name:'Second loan'},
  ].filter(m => {
    if(!m.date) return false;
    const d = daysUntil(m.date);
    return d > STALE_CUTOFF_DAYS;
  });

  const futureMats = mats.filter(m => daysUntil(m.date) > 0).sort((a,b)=>daysUntil(a.date)-daysUntil(b.date));
  const pastMats = mats.filter(m => daysUntil(m.date) <= 0).sort((a,b)=>daysUntil(b.date)-daysUntil(a.date));
  const activeMats = futureMats.length ? futureMats : pastMats;

  let bestMat=0;
  if(activeMats.length === 0){
    details.push({cat:'Loan Maturity', label:'No active mortgage maturity date on record'});
  }
  for(const {date,name,lender,amt} of activeMats.slice(0,1)){
    if(!date) continue;
    const days = daysUntil(date);
    const lenderStr = lender ? ` (${lender}${amt?' — '+fmtMoney(amt):''})`:'';
    const matDateStr = fmtDate(date);
    let s=0, lbl='';
    if(days<0&&days>-180){s=80;lbl=`${name}${lenderStr} matured ${Math.abs(Math.round(days))} days ago — ${matDateStr}`;}
    else if(days<0&&days>-365){s=60;lbl=`${name}${lenderStr} matured ${Math.abs(Math.round(days/30))} months ago — ${matDateStr}`;}
    else if(days<0){s=30;lbl=`${name}${lenderStr} matured ${Math.abs(Math.round(days/365*10)/10)} yrs ago — ${matDateStr}`;}
    else if(days<90){s=95;lbl=`${name}${lenderStr} matures in ${Math.round(days)} days — ${matDateStr}`;}
    else if(days<180){s=85;lbl=`${name}${lenderStr} matures in ${Math.round(days/30)} months — ${matDateStr}`;}
    else if(days<365){s=70;lbl=`${name}${lenderStr} matures within 1 year — ${matDateStr}`;}
    else if(days<730){s=45;lbl=`${name}${lenderStr} matures in ~${Math.round(days/365)} yrs — ${matDateStr}`;}
    else if(days<1095){s=20;lbl=`${name}${lenderStr} matures in ~${Math.round(days/365)} yrs — ${matDateStr}`;}
    else{lbl=`${name}${lenderStr} — maturity ${matDateStr} (>3 yrs away)`;}
    if(s>bestMat){ bestMat=s; }
    if(lbl) details.push({cat:'Loan Maturity',label:lbl});
  }
  cats.loanMaturity = bestMat;
  if(p.mortgage_amount && p.mortgage2_amount && activeMats.length>1){
    const l2 = activeMats[1];
    details.push({cat:'Loan Maturity',label:`Multiple active loans — second: ${l2.lender||'unknown lender'}${l2.amt?' '+fmtMoney(l2.amt):''}, matures ${fmtDate(l2.date)}`});
    cats.loanMaturity = Math.max(cats.loanMaturity, 25);
  }

  // DISTRESS
  const prefoActive = p.preforeclosure_active_flag===true||p.preforeclosure_active_flag==='true'||p.preforeclosure_active_flag==='True';
  if(prefoActive){
    cats.distress=100;
    const recordingDate = fmtDate(p.preforeclosure_recording_date);
    const plaintiff = p.preforeclosure_plaintiff_1 ? ` — Filed by: ${p.preforeclosure_plaintiff_1}` : '';
    const docType = p.preforeclosure_doc_type ? ` (${p.preforeclosure_doc_type})` : '';
    const deedCat = p.preforeclosure_deed_category ? ` — Category: ${p.preforeclosure_deed_category}` : '';
    details.push({cat:'Distress',label:`🚨 Active preforeclosure${docType}${deedCat}${recordingDate?', recorded '+recordingDate:''}${plaintiff}`});
  }
  const auction = parseD(p.preforeclosure_auction_date);
  if(auction){
    const d = daysUntil(auction);
    const time = p.preforeclosure_auction_time ? ` at ${p.preforeclosure_auction_time}` : '';
    const loc = p.preforeclosure_street_address_of_auction_call ? ` — Location: ${p.preforeclosure_street_address_of_auction_call}` : '';
    const trustee = p.preforeclosure_trustee_name ? ` — Trustee: ${p.preforeclosure_trustee_name}` : '';
    if(d!==null && d>0 && d<180){
      cats.distress=Math.max(cats.distress,90);
      details.push({cat:'Distress',label:`Foreclosure auction in ${Math.round(d)} days (${fmtDate(p.preforeclosure_auction_date)}${time})${loc}${trustee}`});
    } else if(d!==null && d>0){
      cats.distress=Math.max(cats.distress,50);
      details.push({cat:'Distress',label:`Foreclosure auction scheduled: ${fmtDate(p.preforeclosure_auction_date)}${time}${loc}${trustee}`});
    } else if(d!==null && d<=0){
      cats.distress=Math.max(cats.distress,60);
      details.push({cat:'Distress',label:`Foreclosure auction date passed (${fmtDate(p.preforeclosure_auction_date)})${trustee}`});
    }
  }
  if(p.preforeclosure_final_judgement_amount && parseFloat(p.preforeclosure_final_judgement_amount)>0){
    cats.distress=Math.max(cats.distress,70);
    const amt=fmtMoney(p.preforeclosure_final_judgement_amount);
    const plaintiff2 = p.preforeclosure_plaintiff_1 ? ` — Plaintiff: ${p.preforeclosure_plaintiff_1}` : '';
    details.push({cat:'Distress',label:`Final judgement on record: ${amt}${plaintiff2}`});
  }
  if(p.preforeclosure_recording_date && !prefoActive && !auction && !(p.preforeclosure_final_judgement_amount>0)){
    cats.distress=Math.max(cats.distress,40);
    const deedCat2 = p.preforeclosure_deed_category ? ` — ${p.preforeclosure_deed_category}` : '';
    const docType2 = p.preforeclosure_doc_type ? ` (${p.preforeclosure_doc_type})` : '';
    details.push({cat:'Distress',label:`Preforeclosure filing on record${docType2}${deedCat2} — ${fmtDate(p.preforeclosure_recording_date)}`});
  }
  if(!prefoActive && !auction && !p.preforeclosure_recording_date && !p.preforeclosure_final_judgement_amount){
    details.push({cat:'Distress',label:'No distress signals on record'});
  }

  // MARKET SIGNALS
  if(p.vacancy){
    const v=parseFloat(p.vacancy);
    if(!isNaN(v)){
      if(v>20){cats.marketSignals=Math.max(cats.marketSignals,70);details.push({cat:'Market',label:`High vacancy: ${v.toFixed(1)}% (above 20% threshold)`});}
      else if(v>10){cats.marketSignals=Math.max(cats.marketSignals,40);details.push({cat:'Market',label:`Elevated vacancy: ${v.toFixed(1)}% (above 10% threshold)`});}
      else {details.push({cat:'Market',label:`Vacancy: ${v.toFixed(1)}% (healthy)`});}
    }
  }
  if(p.actual_cap_rate){
    const c=parseFloat(p.actual_cap_rate);
    if(!isNaN(c)&&c>0){
      if(c<4.5){cats.marketSignals=Math.max(cats.marketSignals,35);details.push({cat:'Market',label:`Compressed cap rate: ${c.toFixed(2)}% — may indicate value-add or sell pressure`});}
      else {details.push({cat:'Market',label:`Cap rate: ${c.toFixed(2)}%`});}
    }
  }
  const yrBuilt=parseFloat(p.year_built);
  if(!isNaN(yrBuilt)){
    const age=new Date().getFullYear()-yrBuilt;
    if(age>60&&!p.year_renovated){
      cats.marketSignals=Math.max(cats.marketSignals,25);
      details.push({cat:'Market',label:`Aging building: built ${Math.round(yrBuilt)} (${age} yrs old), no renovation on record`});
    } else if(p.year_renovated){
      details.push({cat:'Market',label:`Built ${Math.round(yrBuilt)}, renovated ${Math.round(p.year_renovated)}`});
    }
  }
  if(p._hasCostar){
    const method = p._matchMethod === 'coord' ? 'coordinate match' : 'address match';
    details.push({cat:'Market',label:`CoStar data linked via ${method} — vacancy and cap rate data augmented`});
  } else {
    details.push({cat:'Market',label:`No CoStar match found — vacancy/cap rate data unavailable`});
  }

  // WEIGHTED FINAL
  const w = getWeights();
  const wTotal = w.holdPeriod+w.loanMaturity+w.distress+w.marketSignals;
  let score = 0;
  if(wTotal>0){
    score = Math.round(
      (cats.holdPeriod*w.holdPeriod + cats.loanMaturity*w.loanMaturity +
       cats.distress*w.distress + cats.marketSignals*w.marketSignals) / wTotal
    );
  }
  const tier = score>=70?'hot':score>=50?'warm':score>=30?'watch':'cold';
  return {score, tier, details, cats};
}

function getWeights(){
  return {
    holdPeriod:+document.getElementById('wHold').value,
    loanMaturity:+document.getElementById('wMat').value,
    distress:+document.getElementById('wDist').value,
    marketSignals:+document.getElementById('wMkt').value,
  };
}

// ─── DATA FETCHING ──────────────────────────────────────────────────────────
async function fetchAll(table, filters){
  // Supabase default limit is 1000 -- paginate to get everything
  const PAGE = 1000;
  let all = [], from = 0, done = false;
  while(!done){
    let q = db.from(table).select('*').range(from, from+PAGE-1);
    if(filters) for(const [col,val] of Object.entries(filters)) q = q.ilike(col,val);
    const { data, error } = await q;
    if(error || !data || data.length === 0){ done=true; break; }
    all = all.concat(data);
    if(data.length < PAGE) done = true;
    else from += PAGE;
  }
  return all;
}

async function loadData(){
  setLoading(true);
  document.getElementById('loadingList').style.display='block';

  // Fetch ALL Reonomy multifamily properties (paginated past 1000 limit)
  const props = await fetchAll('properties', {'property_type':'%multifamily%'});

  // Fetch ALL CoStar records
  const costar = await fetchAll('costar2', null);

  // Match and merge -- ALL Reonomy properties are included
  // Step 1: coordinate match (within ~50 meters)
  // Step 2: fallback to normalized address match
  let matchCount = 0;
  let coordMatchCount = 0;
  let addrMatchCount = 0;

  // Build CoStar spatial index -- bucket by rounded lat/lng for fast lookup
  const costarByCoord = {};
  const costarByAddr = {};
  (costar||[]).forEach(c=>{
    // Address index
    const ak = normalizeAddr(c.property_address);
    if(ak) costarByAddr[ak] = c;
    // Coordinate index -- bucket to ~0.01 degree grid (~1km)
    const lat = parseFloat(c.latitude), lng = parseFloat(c.longitude);
    if(!isNaN(lat) && !isNaN(lng)){
      const bucket = `${Math.round(lat*100)}_${Math.round(lng*100)}`;
      if(!costarByCoord[bucket]) costarByCoord[bucket] = [];
      costarByCoord[bucket].push({...c, _lat:lat, _lng:lng});
    }
  });

  allData = (props||[]).map(p=>{
    const pLat = parseFloat(p.latitude), pLng = parseFloat(p.longitude);
    let costarMatch = null;
    let matchMethod = null;

    // Try coordinate match first (check nearby buckets)
    if(!isNaN(pLat) && !isNaN(pLng)){
      const bLat = Math.round(pLat*100), bLng = Math.round(pLng*100);
      let bestDist = Infinity;
      // Check 3x3 grid of buckets to handle edge cases
      for(let dlat=-1; dlat<=1; dlat++){
        for(let dlng=-1; dlng<=1; dlng++){
          const bucket = `${bLat+dlat}_${bLng+dlng}`;
          const candidates = costarByCoord[bucket] || [];
          for(const c of candidates){
            const dist = haversineMeters(pLat, pLng, c._lat, c._lng);
            if(dist < 75 && dist < bestDist){ // within 75 meters
              bestDist = dist;
              costarMatch = c;
              matchMethod = 'coord';
            }
          }
        }
      }
    }

    // Fallback: normalized address match
    if(!costarMatch){
      const ak = normalizeAddr(p.address_line_1||'');
      if(ak && costarByAddr[ak]){
        costarMatch = costarByAddr[ak];
        matchMethod = 'addr';
      }
    }

    if(costarMatch){
      matchCount++;
      if(matchMethod==='coord') coordMatchCount++;
      else addrMatchCount++;
    }

    const merged = costarMatch ? {
      ...p,
      vacancy: costarMatch.vacancy || p.vacancy,
      actual_cap_rate: costarMatch.actual_cap_rate || p.actual_cap_rate,
      pro_forma_cap_rate: costarMatch.pro_forma_cap_rate,
      price_per_unit: costarMatch.price_per_unit,
      building_class: costarMatch.building_class,
      submarket_name: costarMatch.submarket_name,
      buyer_true_company: costarMatch.buyer_true_company,
      seller_true_company: costarMatch.seller_true_company,
      _costar: costarMatch,
      _matchMethod: matchMethod,
    } : p;
    merged._hasCostar = !!costarMatch;

    const {score,tier,details,cats} = scoreProperty(merged);
    return {...merged, _score:score, _tier:tier, _details:details, _cats:cats};
  });

  console.log(`Loaded ${allData.length} properties | CoStar matches: ${matchCount} (${coordMatchCount} by coords, ${addrMatchCount} by address)`);
  document.getElementById('matchInfo').textContent =
    `${allData.length.toLocaleString()} properties · ${matchCount} CoStar matches (${coordMatchCount} coord, ${addrMatchCount} addr)`;

  setLoading(false);
  document.getElementById('loadingList').style.display='none';
  applyFilters();
  initMap();
}

function haversineMeters(lat1, lng1, lat2, lng2){
  const R = 6371000;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)*Math.sin(dLat/2) +
    Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
    Math.sin(dLng/2)*Math.sin(dLng/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function normalizeAddr(s){
  return (s||'').toLowerCase().trim()
    .replace(/\s+/g,' ')
    .replace(/\bstreet\b/g,'st').replace(/\bavenue\b/g,'ave')
    .replace(/\bboulevard\b/g,'blvd').replace(/\bdrive\b/g,'dr')
    .replace(/\broad\b/g,'rd').replace(/\bcourt\b/g,'ct')
    .replace(/\bnorthwest\b/g,'nw').replace(/\bnortheast\b/g,'ne')
    .replace(/\bsouthwest\b/g,'sw').replace(/\bsoutheast\b/g,'se')
    .replace(/[.,#]/g,'').trim();
}

// ─── FILTERING & SORTING ────────────────────────────────────────────────────
function applyFilters(){
  let data = [...allData];
  if(searchQ){
    const q=searchQ.toLowerCase();
    data=data.filter(p=>
      (p.address_line_1||p.property_address||'').toLowerCase().includes(q)||
      (p.reported_owner_name||'').toLowerCase().includes(q)||
      (p.address_city||'').toLowerCase().includes(q)||
      (p.msa_name||'').toLowerCase().includes(q)||
      (p.contact_name||'').toLowerCase().includes(q)
    );
  }
  if(activeTier!=='all') data=data.filter(p=>p._tier===activeTier);

  // Sort
  const sort = document.getElementById('sortSelect').value;
  if(sort==='score') data.sort((a,b)=>b._score-a._score);
  else if(sort==='maturity'){
    const getBestMatDate = p => {
      const STALE = -365*24*3600*1000;
      const today = new Date();
      const m1 = parseD(p.mortgage_maturity_date);
      const m2 = parseD(p.mortgage2_maturity_date);
      const valid = [m1,m2].filter(d => d && (d-today) > STALE);
      if(!valid.length) return null;
      const future = valid.filter(d => d > today);
      if(future.length) return future.reduce((a,b)=>a<b?a:b); // soonest future first
      return valid.reduce((a,b)=>a>b?a:b); // most recent past
    };
    data.sort((a,b)=>{
      const da=getBestMatDate(a), db=getBestMatDate(b);
      if(!da&&!db) return 0;
      if(!da) return 1;  // no maturity date goes to bottom
      if(!db) return -1;
      return da-db; // soonest maturity at top
    });
  }
  else if(sort==='hold'){
    data.sort((a,b)=>{
      const ya=yearsSince(parseD(a.sale_recorded_date||a.sale_date))||0;
      const yb=yearsSince(parseD(b.sale_recorded_date||b.sale_date))||0;
      return yb-ya;
    });
  }
  else if(sort==='sale_amount') data.sort((a,b)=>(parseFloat(b.sale_amount||b.sale_price)||0)-(parseFloat(a.sale_amount||a.sale_price)||0));

  filtered = data;
  renderList();
  renderMap();
  document.getElementById('totalBadge').textContent = allData.length.toLocaleString();
  document.getElementById('tbCount').textContent = `Showing ${filtered.length.toLocaleString()} of ${allData.length.toLocaleString()} properties`;
}

function resort(){ applyFilters(); }
function setTier(t){
  activeTier=t;
  document.querySelectorAll('.tier-btn').forEach(b=>b.classList.toggle('active',b.dataset.tier===t));
  applyFilters();
}

document.getElementById('searchInput').addEventListener('input',e=>{
  searchQ=e.target.value; applyFilters();
});

// ─── LIST RENDERING ─────────────────────────────────────────────────────────
function renderList(){
  const panel = document.getElementById('listPanel');
  if(!filtered.length){
    panel.innerHTML='<div class="empty-state"><div class="empty-icon">🏢</div><div>No properties match your filters</div></div>';
    return;
  }
  panel.innerHTML = filtered.map(p=>propCard(p)).join('');
}

function propCard(p){
  const addr = p.address_line_1||p.property_address||'Unknown Address';
  const city = p.address_city||p.portfolio_city||'';
  const state = p.address_state||p.portfolio_state||'';
  const sub = [city,state].filter(Boolean).join(', ');
  const chips = buildChips(p);
  const sel = p.id===selectedId?'selected':'';
  return `<div class="prop-card ${sel}" onclick="selectProperty('${p.id}')">
    <div class="pc-top">
      <div>
        <div class="pc-address">${addr}</div>
        ${sub?`<div class="pc-sub">${sub}${p.property_subtype?' · '+p.property_subtype:''}</div>`:''}
      </div>
      <div class="score-badge ${p._tier}">${p._score}</div>
    </div>
    ${chips.length?`<div class="pc-chips">${chips.map(c=>`<span class="pc-chip ${c.cls}">${c.label}</span>`).join('')}</div>`:''}
  </div>`;
}

function buildChips(p){
  const chips=[];
  const STALE = -365; // ignore maturity dates more than 1 year in the past

  // Most recent sale date
  const sd1 = parseD(p.sale_recorded_date||p.sale_date);
  const sd2 = parseD(p.sale2_recorded_date);
  const sd = (sd1&&sd2) ? (sd1>sd2?sd1:sd2) : (sd1||sd2);

  // Find the most relevant non-stale maturity date
  const mat1 = parseD(p.mortgage_maturity_date);
  const mat2 = parseD(p.mortgage2_maturity_date);
  const mat1Days = mat1 ? daysUntil(mat1) : null;
  const mat2Days = mat2 ? daysUntil(mat2) : null;
  const mat1Valid = mat1Days !== null && mat1Days > STALE;
  const mat2Valid = mat2Days !== null && mat2Days > STALE;

  // Pick best maturity to show: prefer future, then most recent past
  let bestMat = null;
  if(mat1Valid && mat2Valid){
    bestMat = (mat1Days >= 0 && mat2Days < 0) ? mat1 :
              (mat2Days >= 0 && mat1Days < 0) ? mat2 :
              (mat1Days >= 0) ? (mat1Days < mat2Days ? mat1 : mat2) : // both future: pick soonest
              (mat1Days > mat2Days ? mat1 : mat2); // both past: pick most recent
  } else if(mat1Valid) bestMat = mat1;
  else if(mat2Valid) bestMat = mat2;

  const prefoActive = p.preforeclosure_active_flag===true||p.preforeclosure_active_flag==='true'||p.preforeclosure_active_flag==='True';
  if(prefoActive) chips.push({cls:'distress',label:'⚠ Preforeclosure'});

  if(bestMat){
    const d = daysUntil(bestMat);
    if(d < 0) chips.push({cls:'maturity',label:`Mat. ${fmtDate(bestMat)} (past)`});
    else chips.push({cls:'maturity',label:`Mat. ${fmtDate(bestMat)}`});
  }

  if(sd){
    const yrs = yearsSince(sd);
    chips.push({cls:'hold',label:`${Math.round(yrs*10)/10} yr hold`});
  }

  if(p.vacancy&&parseFloat(p.vacancy)>10) chips.push({cls:'market',label:`${parseFloat(p.vacancy).toFixed(0)}% vacant`});
  return chips.slice(0,4);
}

function initMap(){
  if(map) return;
  map = L.map('map',{center:[38.906,-77.036],zoom:12,zoomControl:false});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
    attribution:'© CARTO',maxZoom:19
  }).addTo(map);
  L.control.zoom({position:'bottomright'}).addTo(map);

  // DC border using real boundary coordinates from official GeoJSON
  L.polygon(DC_COORDS,{
    color:'#1a73e8',weight:2.5,fill:false,opacity:0.8,dashArray:'8,5'
  }).addTo(map);

  markersLayer = L.layerGroup().addTo(map);

  // Use Leaflet's own API to stop scroll propagation on the sidebar
  // This is the correct fix -- Leaflet intercepts wheel events on the map container
  const drawer = document.getElementById('detailDrawer');
  L.DomEvent.disableScrollPropagation(drawer);
}

function renderMap(){
  if(!map) return;
  markersLayer.clearLayers();
  const tierColors={hot:'#d93025',warm:'#fa7b17',watch:'#f29900',cold:'#188038'};
  filtered.forEach(p=>{
    const lat=parseFloat(p.latitude), lng=parseFloat(p.longitude);
    if(isNaN(lat)||isNaN(lng)) return;
    const isSelected=p.id===selectedId;
    const sz=isSelected?14:9;
    const icon=L.divIcon({
      className:'',
      html:`<div class="map-dot ${p._tier}${isSelected?' selected':''}" style="width:${sz}px;height:${sz}px"></div>`,
      iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]
    });
    const addr=p.address_line_1||p.property_address||'';
    const m=L.marker([lat,lng],{icon});
    m.bindTooltip(`<b>${addr}</b><br>Score: ${p._score} · ${p._tier.charAt(0).toUpperCase()+p._tier.slice(1)}`,{direction:'top',offset:[0,-4]});
    m.on('click',()=>selectProperty(p.id));
    markersLayer.addLayer(m);
  });
}

// ─── PROPERTY DETAIL ────────────────────────────────────────────────────────
function selectProperty(id){
  selectedId = id;
  const p = allData.find(x=>String(x.id)===String(id));
  if(!p) return;
  renderList();
  renderMap();
  openDrawer(p);
  // Pan map to property
  if(map){
    const lat=parseFloat(p.latitude),lng=parseFloat(p.longitude);
    if(!isNaN(lat)&&!isNaN(lng)) map.panTo([lat,lng],{animate:true});
  }
}

function openDrawer(p){
  const addr = p.address_line_1||p.property_address||'Unknown';
  const city = [p.address_city||p.portfolio_city,p.address_state||p.portfolio_state].filter(Boolean).join(', ');
  const tierLabel={hot:'Hot',warm:'Warm',watch:'Watch',cold:'Cold'}[p._tier];

  const catLabels={holdPeriod:'Hold',loanMaturity:'Maturity',distress:'Distress',marketSignals:'Market'};
  const catBars = Object.entries(p._cats).map(([k,v])=>`
    <div class="sb-row">
      <span class="sb-cat">${catLabels[k]||k}</span>
      <div class="sb-bar-wrap"><div class="sb-bar ${k==='holdPeriod'?'hold':k==='loanMaturity'?'maturity':k==='distress'?'distress':'market'}" style="width:${v}%"></div></div>
      <span class="sb-score">${v}</span>
    </div>`).join('');

  const reasonsList = p._details.length
    ? `<ul class="sb-reasons">${p._details.map(d=>`<li><span>${d.label}</span></li>`).join('')}</ul>`
    : '<p style="font-size:12px;color:var(--text2);padding:4px 0">No specific signals detected</p>';

  const grid = buildDetailGrid(p);
  const contacts = buildContacts(p);
  const reoLink = p.link?`<a href="${p.link}" target="_blank" class="reo-link">View on Reonomy →</a>`:'';

  document.getElementById('drawerContent').innerHTML = `
    <div class="dd-header">
      <div style="flex:1">
        <div class="dd-title">${addr}</div>
        ${city?`<div class="dd-sub">${city}${p.property_subtype?' · '+p.property_subtype:''}</div>`:''}
      </div>
      <div class="dd-score-big ${p._tier}">
        <div class="ddsb-num">${p._score}</div>
        <div class="ddsb-label">${tierLabel}</div>
      </div>
      <button class="dd-close" onclick="closeDrawer()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="dd-body">
      <div class="dd-section">
        <div class="dd-section-title">Score Breakdown</div>
        <div class="score-breakdown">${catBars}</div>
        <div class="dd-section-title" style="margin-top:12px">Why this score?</div>
        ${reasonsList}
      </div>
      <div class="dd-section">
        <div class="dd-section-title">Property Details</div>
        ${grid}
      </div>
      ${contacts?`<div class="dd-section"><div class="dd-section-title">Contacts</div>${contacts}</div>`:''}
      ${reoLink?`<div class="dd-section">${reoLink}</div>`:''}
    </div>`;

  document.getElementById('detailDrawer').classList.add('open');
  document.getElementById('backdrop').classList.add('show');
}

function buildDetailGrid(p){
  const today = new Date();
  const STALE = -365*24*3600*1000;
  const mat1 = parseD(p.mortgage_maturity_date);
  const mat2 = parseD(p.mortgage2_maturity_date);
  const mat1Valid = mat1 && (mat1-today) > STALE;
  const mat2Valid = mat2 && (mat2-today) > STALE;
  const c = p._costar || {};

  const section = (title, rows) => {
    const filtered = rows.filter(r=>r&&r[1]!=null&&r[1]!==undefined&&r[1]!=='');
    if(!filtered.length) return '';
    return `<div class="dg-section-head">${title}</div>` +
      filtered.map(([label,val,full])=>`
        <div class="dg-item ${full?'full':''}">
          <div class="dg-label">${label}</div>
          <div class="dg-val">${val}</div>
        </div>`).join('');
  };

  const reoSection = section('Property (Reonomy)', [
    ['Address', p.address_full, true],
    ['Type', p.property_type],
    ['Subtype', p.property_subtype],
    ['Year Built', p.year_built?Math.round(p.year_built):null],
    ['Year Renovated', p.year_renovated?Math.round(p.year_renovated):null],
    ['Total Units', p.total_units],
    ['Bldg SF', p.gross_building_area?Math.round(p.gross_building_area).toLocaleString()+' SF':null],
    ['APN', p.apn],
    ['Owner', p.reported_owner_name, true],
    ['Owner Mailing', p.reported_mailing_address_full, true],
  ]);

  const saleSection = section('Sale History', [
    ['Sale Price', fmtMoney(p.sale_amount)],
    ['Sale Date', fmtDate(p.sale_recorded_date)],
    ['Price/SF', p.sales_price_per_sf?`$${parseFloat(p.sales_price_per_sf).toFixed(2)}`:null],
    ['Prior Sale', fmtMoney(p.sale2_amount)],
    ['Prior Sale Date', fmtDate(p.sale2_recorded_date)],
  ]);

  const mortSection = section('Mortgage', [
    mat1Valid?['Lender', p.mortgage_standardized_name||p.mortgage_recorded_name, true]:null,
    mat1Valid?['Amount', fmtMoney(p.mortgage_amount)]:null,
    mat1Valid?['Recorded', fmtDate(p.mortgage_recorded_date)]:null,
    mat1Valid?['Maturity', fmtDate(p.mortgage_maturity_date)]:null,
    mat2Valid?['Lender 2', p.mortgage2_standardized_name||p.mortgage2_recorded_name, true]:null,
    mat2Valid?['Amount 2', fmtMoney(p.mortgage2_amount)]:null,
    mat2Valid?['Maturity 2', fmtDate(p.mortgage2_maturity_date)]:null,
  ]);

  const costarSection = p._hasCostar ? section('Market Data (CoStar)', [
    ['Address (CoStar)', c.property_address, true],
    ['County', c.property_county],
    ['Submarket', c.submarket_name],
    ['Building Class', c.building_class],
    ['Units (CoStar)', c.number_of_units],
    ['Bldg SF (CoStar)', c.building_sf?Math.round(parseFloat(c.building_sf)).toLocaleString()+' SF':null],
    ['Vacancy', c.vacancy?parseFloat(c.vacancy).toFixed(1)+'%':null],
    ['Actual Cap Rate', c.actual_cap_rate?parseFloat(c.actual_cap_rate).toFixed(2)+'%':null],
    ['Pro Forma Cap', c.pro_forma_cap_rate?parseFloat(c.pro_forma_cap_rate).toFixed(2)+'%':null],
    ['Sale Price (CoStar)', fmtMoney(c.sale_price)],
    ['Sale Date (CoStar)', fmtDate(c.sale_date)],
    ['Price/Unit', fmtMoney(c.price_per_unit)],
    ['Price/SF (CoStar)', c.price_per_sf?`$${parseFloat(c.price_per_sf).toFixed(2)}`:null],
    ['Buyer', c.buyer_true_company, true],
    ['Seller', c.seller_true_company, true],
    ['Down Payment', fmtMoney(c.down_payment)],
    ['1st TD Balance', fmtMoney(c.first_trust_deed_balance)],
    ['1st TD Lender', c.first_trust_deed_lender, true],
    ['1st TD Terms', c.first_trust_deed_terms, true],
    ['Gross Income', fmtMoney(c.gross_income)],
    ['Net Income', fmtMoney(c.net_income)],
    ['Match Method', p._matchMethod==='coord'?'GPS coordinates':'Address string'],
  ]) : '<div class="dg-item full"><div class="dg-label">CoStar</div><div class="dg-val" style="color:var(--text3)">No CoStar match found</div></div>';

  return `<div class="detail-grid">${reoSection}${saleSection}${mortSection}${costarSection}</div>`;
}

function buildContacts(p){
  const contacts=[];
  const cs=[
    {name:p.contact_name,co:p.contact_company_name,title:p.contact_title,phone:p.contact_phone_1,email:p.contact_email_1},
    {name:p.contact_2_name,co:p.contact_2_company_name,title:p.contact_2_title,phone:p.contact_2_phone_1,email:p.contact_2_email_1},
    {name:p.contact_3_name,co:p.contact_3_company_name,title:p.contact_3_title,phone:p.contact_3_phone_1,email:p.contact_3_email_1},
  ];
  return cs.filter(c=>c.name).map(c=>`
    <div class="contact-card">
      <div class="cc-name">${c.name}</div>
      ${c.title?`<div class="cc-title">${c.title}</div>`:''}
      ${c.co?`<div class="cc-title" style="color:var(--text)">${c.co}</div>`:''}
      <div class="cc-contact">
        ${c.phone?`<span>📞 ${c.phone}</span>`:''}
        ${c.email?`<span>✉ ${c.email}</span>`:''}
      </div>
    </div>`).join('');
}

function closeDrawer(){
  selectedId=null;
  document.getElementById('detailDrawer').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
  renderList();
  renderMap();
}

// ─── WEIGHTS & CONFIG ───────────────────────────────────────────────────────
function toggleWeights(){
  const panel = document.getElementById('weightsPanel');
  const btn = document.getElementById('weightsToggleBtn');
  const isOpen = panel.classList.contains('open');
  if(isOpen){
    panel.classList.remove('open');
    btn.classList.remove('active');
  } else {
    panel.classList.add('open');
    btn.classList.add('active');
  }
}

function toggleHP(btn){
  btn.classList.toggle('active');
}

function addCustomHP(){
  const inp=document.getElementById('customHP');
  const yr=parseFloat(inp.value);
  if(isNaN(yr)||yr<1||yr>50) return;
  const container=document.getElementById('holdChips');
  if(container.querySelector(`[data-yr="${yr}"]`)) return;
  const chip=document.createElement('button');
  chip.className='hp-chip active';
  chip.dataset.yr=yr;
  chip.textContent=`${yr}yr`;
  chip.onclick=()=>toggleHP(chip);
  container.appendChild(chip);
  inp.value='';
}

function recalculate(){
  // Rebuild hold periods from chips
  holdPeriods = Array.from(document.querySelectorAll('.hp-chip.active')).map(c=>parseFloat(c.dataset.yr));
  // Rescore all data
  allData = allData.map(p=>{
    const merged = p._reonomy?{...p._reonomy,...(p._costar||{}),_reonomy:p._reonomy,_costar:p._costar}:p;
    const {score,tier,details,cats}=scoreProperty(merged);
    return {...p,_score:score,_tier:tier,_details:details,_cats:cats};
  });
  applyFilters();
  toggleWeights();
}

function setLoading(v){
  document.getElementById('loadingSpinner').style.display=v?'block':'none';
}

// ─── INIT ────────────────────────────────────────────────────────────────────
loadData();
